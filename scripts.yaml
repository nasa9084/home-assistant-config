---
unlock:
  sequence:
    - if:
        - condition: state
          entity_id: switch.rihinkurumu_otorotuku
          state: 'on'
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.rihinkurumu_otorotuku
          data: {}
      else:
        - action: switch.turn_on
          target:
            entity_id: switch.rihinkurumu_otorotuku
          data: {}
    - action: lock.unlock
      metadata: {}
      target:
        entity_id: lock.sesami5
      data: {}
  alias: '帰宅: unlock'
  description: ''
