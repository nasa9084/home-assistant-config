---
unlock:
  sequence:
    - if:
        - condition: state
          entity_id: switch.otorotuku
          state: 'on'
      then:
        action: switch.turn_off
        target:
          entity_id: switch.otorotuku
        data: {}
      else:
        action: switch.turn_on
        target:
          entity_id: switch.otorotuku
        data: {}
    - action: lock.unlock
      metadata: {}
      target:
        entity_id: lock.sesami5
      data: {}
  alias: '帰宅: unlock'
  description: ''
