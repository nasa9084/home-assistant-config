---
esphome:
  name: m5stack-timer-camera-f
  friendly_name: M5Stack Timer Camera F

esp32:
  variant: esp32
  board: m5stack-timer-cam
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key_m5stack_timer_camera_f

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: M5Stack Timer C Fallback Hotspot
    password: !secret ap_password_m5stack_timer_camera_f

i2c:
  - id: cam_i2c
    sda: GPIO25
    scl: GPIO23

esp32_camera:
  name: Camera
  external_clock:
    pin: GPIO27
    frequency: 20MHz
  i2c_id: cam_i2c
  data_pins: [GPIO32, GPIO35, GPIO34, GPIO5, GPIO39, GPIO18, GPIO36, GPIO19]
  vsync_pin: GPIO22
  href_pin: GPIO26
  pixel_clock_pin: GPIO21
  reset_pin: GPIO15
  resolution: 1600x1200
  jpeg_quality: 10
  max_framerate: 1 fps
  idle_framerate: 0.0167 fps
  horizontal_mirror: false

switch:
  - platform: gpio
    id: bat_hold_pin
    name: Battery Hold Pin
    pin: GPIO33
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

captive_portal:
