---
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: night_nap

deep_sleep:
  id: deep_sleep_1

script:
  - id: night_nap
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              auto t = id(ha_time).now();
              return t.is_valid() && (t.hour >= 21 || t.hour < 8);
          then:
            - delay: 30s
            - deep_sleep.enter:
                sleep_duration: 10min

esphome:
  name: m5stack-timer-camera-f
  friendly_name: M5Stack Timer Camera F

esp32:
  variant: esp32
  board: m5stack-timer-cam
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key_m5stack_timer_camera_f

ota:
  - platform: esphome
    encryption:
    on_begin:
      then:
        - deep_sleep.prevent: deep_sleep_1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: M5Stack Timer C Fallback Hotspot
    password: !secret ap_password_m5stack_timer_camera_f

i2c:
  - id: cam_i2c
    sda: GPIO25
    scl: GPIO23

esp32_camera:
  name: Camera
  external_clock:
    pin: GPIO27
    frequency: 20MHz
  i2c_id: cam_i2c
  data_pins: [GPIO32, GPIO35, GPIO34, GPIO5, GPIO39, GPIO18, GPIO36, GPIO19]
  vsync_pin: GPIO22
  href_pin: GPIO26
  pixel_clock_pin: GPIO21
  reset_pin: GPIO15
  resolution: 1600x1200
  jpeg_quality: 10
  max_framerate: 1 fps
  idle_framerate: 0.1 fps
  horizontal_mirror: false

switch:
  - platform: gpio
    id: bat_hold_pin
    name: Battery Hold Pin
    pin: GPIO33
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
  # Battery voltage (about 3.3 V empty to 4.2 V full). The node is awake for only about 30 seconds
  # at night, so sample often enough to be reported before it goes back to sleep.
  - platform: adc
    pin: GPIO38
    name: Battery Voltage
    attenuation: 12db
    filters:
      - multiply: 1.51
    update_interval: 10s

captive_portal:
