---
# The stove camera sleeps from 21:00 to 08:00 and wakes every 10 minutes for a few
# seconds, so keep the latest frame in a file (shown by the Local File camera).
# The camera entity stays available while the node sleeps, so detect each wake-up by its
# uptime starting over.
- id: stove_camera_save_snapshot
  alias: Stove camera - save the latest snapshot
  mode: restart
  triggers:
    - trigger: state
      entity_id: sensor.m5stack_timer_camera_f_uptime
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state | float(999) < 60 }}"
  actions:
    # Wait for the first frame: the camera sends one every 10 seconds when idle.
    - delay: "00:00:15"
    - action: camera.snapshot
      target:
        entity_id: camera.m5stack_timer_camera_f_camera
      data:
        filename: /media/stove_latest.jpg
