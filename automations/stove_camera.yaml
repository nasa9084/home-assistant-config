---
# The stove camera sleeps from 21:00 to 08:00 and wakes every 10 minutes for a few
# seconds. Its camera entity is unavailable while it sleeps, so keep the latest
# frame in a file (shown by the local_file camera in configuration.yaml).
- id: stove_camera_save_snapshot
  alias: Stove camera - save the latest snapshot
  mode: restart
  triggers:
    - trigger: state
      entity_id: camera.m5stack_timer_camera_f_camera
      from: unavailable
  actions:
    # Wait for the first frame: the camera sends one every 10 seconds when idle.
    - delay: "00:00:15"
    - action: camera.snapshot
      target:
        entity_id: camera.m5stack_timer_camera_f_camera
      data:
        filename: /media/stove_latest.jpg
