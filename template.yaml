---
- weather:
    - name: "JMA 札幌"
      unique_id: jma_weather_sapporo
      temperature_unit: "°C"
      attribution_template: >-
        {% set ts = state_attr('sensor.jma_sapporo_short','timeSeries') %}
        {% set a = ts[0].areas | selectattr('area.name','eq','石狩地方') | first %}
        {{ a.weathers[0] }}
      condition_template: >-
        {% set ts = state_attr('sensor.jma_sapporo_short','timeSeries') %}
        {% set a = ts[0].areas | selectattr('area.name','eq','石狩地方') | first %}
        {% set c = a.weatherCodes[0] %}
        {% set w = a.weathers[0] | replace('　','') %}
        {% if '雷' in w %} lightning-rainy
        {% elif '激しく' in w %} pouring
        {% elif c[0] == '4' %} snowy
        {% elif c[0] == '3' %} rainy
        {% elif '雪' in w %} snowy-rainy
        {% elif '雨' in w %} rainy
        {% elif '霧' in w %} fog
        {% elif c in ['201','210','211'] %} partlycloudy
        {% elif c[0] == '2' %} cloudy
        {% elif c in ['101','110','111','112','115'] %} partlycloudy
        {% elif c[0] == '1' %} sunny
        {% else %} exceptional
        {% endif %}
      temperature_template: >-
        {% set ts = state_attr('sensor.jma_sapporo_short','timeSeries') %}
        {% set t = ts[2].areas | selectattr('area.name','eq','札幌') | first %}
        {{ t.temps | last | int }}
      humidity_template: "{{ none }}"
      forecast_daily_template: >-
        {% set w = state_attr('sensor.jma_sapporo_week','timeSeries') %}
        {% set a = w[0].areas[0] %}
        {% set t = w[1].areas | selectattr('area.name','eq','札幌') | first %}
        {% set ns = namespace(f=[]) %}
        {% for i in range(w[0].timeDefines | length) %}
          {% if t.tempsMax[i] != '' %}
            {% set ns.f = ns.f + [{
              'datetime': w[0].timeDefines[i],
              'condition': {'1':'sunny','2':'cloudy','3':'rainy','4':'snowy'}.get(a.weatherCodes[i][0],'cloudy'),
              'temperature': t.tempsMax[i] | int,
              'templow': t.tempsMin[i] | int,
              'precipitation_probability': a.pops[i] | int(0)
            }] %}
          {% endif %}
        {% endfor %}
        {{ ns.f }}
