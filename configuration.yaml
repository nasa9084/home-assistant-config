---
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# REST-based resources
rest: !include rest.yaml

template: !include template.yaml

recorder: !include recorder.yaml

prometheus:

# Latest frame of the stove camera, which is unavailable while it sleeps at night
# (see automations.yaml). The file must exist when this is loaded: take one
# snapshot first, then reload or restart.
camera:
  - platform: local_file
    name: Stove camera (latest)
    file_path: /media/stove_latest.jpg
